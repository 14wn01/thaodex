ea name="address"></textarea></label><label>Khóa học <select name="course"><option>HTML &amp; CSS</option><option>JavaScript</option><option>Java</option><option>Python</option></select></label><fieldset><legend>Hình thức học</legend><label><input type="radio" name="study_type" value="online">Online</label><label><input type="radio" name="study_type" value="offline">Offline</label></fieldset><fieldset><legend>Sở thích</legend><label><input type="checkbox" name="hobby" value="Thể thao">Thể thao</label><label><input type="checkbox" name="hobby" value="Âm nhạc">Âm nhạc</label><label><input type="checkbox" name="hobby" value="Đọc sách">Đọc sách</label><label><input type="checkbox" name="hobby" value="Du lịch">Du lịch</label><label><input type="checkbox" name="hobby" value="Chơi game">Chơi game</label><label><input type="checkbox" name="hobby" value="Điện ảnh">Điện ảnh</label><label><input type="checkbox" name="hobby" value="Lướt web">Lướt web</label></fieldset><label>Ghi chú <textarea name="note"></textarea></label><button type="submit">Đăng ký</button> <button type="reset">Nhập lại</button></form></body></html>
