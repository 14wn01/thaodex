<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Form</title><style>body{font:16px/1.6 "Lucida Grande","Lucida Sans Unicode",Tahoma,sans-serif;max-width:900px;margin:30px auto;padding:0 20px}form{padding:24px;background:#f4f8fc;border:1px solid #a5b6cb;margin-bottom:24px}label{display:block;margin:12px 0}fieldset label{display:inline-block;margin-right:15px}input,select,textarea,button{font:inherit;padding:6px}table{border-collapse:collapse}th,td{border:1px solid #333;padding:10px}th{background:#e3edfa}</style></head><body><form method="get" action="simpleform.html"><h2>Order Form</h2><label>What would you like to buy? <select name="product"><option>A</option><option>B (+ 0.5$)</option><option>C (+ 0.5$)</option></select></label><fieldset><legend>How many would you like to order?</legend><label><input type="radio" name="rd" value="1" required>1 - $10</label><label><input type="radio" name="rd" value="2">2 - $20</label><label><input type="radio" name="rd" value="3">3 - $25</label></fieldset><label>Name * <input name="firstname" placeholder="FirstName" required><input name="lastname" placeholder="LastName" required></label><label>Email <input name="email" type="email"></label><label>Phone Number <input name="phone1" size="5"> - <input name="phone2" size="5"> - <input name="phone3" size="5"></label><button type="submit">Submit</button></form></body></html>
