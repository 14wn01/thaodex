<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bootstrap Registration</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"><style>html{scroll-behavior:smooth}img{max-width:100%}.hero{background:#17385c;color:#fff}section{scroll-margin-top:80px}</style></head><body><main class="container py-5" style="max-width:650px"><h1 class="text-center">Đăng ký người dùng</h1><p class="text-muted text-center">Form thực hành chạy tại trình duyệt.</p><form id="register"><div class="mb-3"><label class="form-label" for="fullname">Họ và tên</label><input class="form-control" id="fullname" name="fullname" type="text"  required></div><div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email"  required></div><div class="mb-3"><label class="form-label" for="password">Mật khẩu</label><input class="form-control" id="password" name="password" type="password" minlength="8" required></div><div class="mb-3"><label class="form-label" for="confirm">Xác nhận mật khẩu</label><input class="form-control" id="confirm" name="confirm" type="password" minlength="8" required></div><fieldset class="mb-3"><legend class="h6">Giới tính</legend><div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="gender" id="gender0" value="Nam" required><label class="form-check-label" for="gender0">Nam</label></div><div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="gender" id="gender1" value="Nữ" required><label class="form-check-label" for="gender1">Nữ</label></div><div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="gender" id="gender2" value="Khác" required><label class="form-check-label" for="gender2">Khác</label></div></fieldset><fieldset class="mb-3"><legend class="h6">Sở thích</legend><div class="form-check"><input class="form-check-input" type="checkbox" name="hobby" id="hobby0" value="Đọc sách"><label class="form-check-label" for="hobby0">Đọc sách</label></div><div class="form-check"><input class="form-check-input" type="checkbox" name="hobby" id="hobby1" value="Lập trình"><label class="form-check-label" for="hobby1">Lập trình</label></div><div class="form-check"><input class="form-check-input" type="checkbox" name="hobby" id="hobby2" value="Du lịch"><label class="form-check-label" for="hobby2">Du lịch</label></div></fieldset><label for="country" class="form-label">Quốc gia</label><select class="form-select mb-3" id="country" name="country"><option>Việt Nam</option><option>Nhật Bản</option><option>Hoa Kỳ</option></select><button class="btn btn-primary w-100" type="submit">Đăng ký</button><p id="result" role="status" class="mt-3"></p></form></main><script>const form=document.getElementById("register"),pass=document.getElementById("password"),confirm=document.getElementById("confirm");function match(){confirm.setCustomValidity(pass.value===confirm.value?"":"Mật khẩu xác nhận chưa khớp.");}pass.addEventListener("input",match);confirm.addEventListener("input",match);form.addEventListener("submit",e=>{e.preventDefault();match();if(form.reportValidity()){document.getElementById("result").textContent="Đăng ký mẫu thành công.";pass.value="";confirm.value="";}});</script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script></body></html>
