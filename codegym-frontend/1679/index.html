<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phim hoạt hình</title><style>*{box-sizing:border-box}body{margin:0;font:18px/1.6 Arial}a{text-decoration:none}.header{position:fixed;top:0;width:100%;background:#fff;padding:18px;box-shadow:0 2px 8px #0002;z-index:1000}body{padding-top:72px}.head-link,.controls,.footer{padding:16px;background:#eef2ff}.controls{display:flex;gap:20px;flex-wrap:wrap}a:hover{font-weight:bold;color:red}.content{display:flex;gap:20px;padding:20px}.left-content{width:260px;flex-shrink:0}.left-content button{display:block;width:100%;padding:20px;margin-bottom:12px;cursor:pointer}.right-content{flex:1;min-width:0}iframe{width:100%;aspect-ratio:16/9;border:0}video{max-width:100%}@media(max-width:700px){.content{flex-direction:column}.left-content{width:100%}}</style></head><body><div class="header"><strong>PHIM HOẠT HÌNH</strong></div><div class="head-link"><a href="#watch">Xem phim</a> | <a href="#list">Danh sách</a></div><div class="controls"><label>Tìm phim <input id="search" type="search"></label><label>Sắp xếp <select id="sort"><option value="new">Mới cập nhật</option><option value="views">Nhiều lượt xem</option></select></label></div><div class="content"><div class="left-content" id="list"></div><div class="right-content" id="watch"><h1 id="movie-title">Doraemon — Tuyển tập 1</h1><iframe id="player" title="Phim hoạt hình" src="https://www.youtube-nocookie.com/embed/LksuYaEESMQ" allowfullscreen loading="lazy"></iframe><p>Nội dung từ kênh phát hành trên YouTube. Chất lượng và quảng cáo do nền tảng video quyết định.</p><details><summary>Video HTML5 minh họa kỹ thuật</summary><video controls preload="none" width="400"><source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">Trình duyệt không hỗ trợ video.</video></details></div></div><div class="footer">Bài thực hành HTML/CSS • Không lưu trữ phim trên website</div><script>const movies=[{id:'LksuYaEESMQ',name:'Doraemon — Tuyển tập 1',date:2,views:100},{id:'5is8OqUkiDw',name:'Doraemon — Tuyển tập 2',date:1,views:200}];function render(){const q=document.getElementById('search').value.toLowerCase();const key=document.getElementById('sort').value==='new'?'date':'views';const list=document.getElementById('list');list.replaceChildren();movies.filter(x=>x.name.toLowerCase().includes(q)).sort((a,b)=>b[key]-a[key]).forEach(m=>{const b=document.createElement('button');b.textContent=m.name;b.onclick=()=>{document.getElementById('player').src='https://www.youtube-nocookie.com/embed/'+m.id;document.getElementById('movie-title').textContent=m.name;};list.appendChild(b);});}document.getElementById('search').oninput=render;document.getElementById('sort').onchange=render;render();</script></body></html>
