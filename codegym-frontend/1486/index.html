<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tìm kiếm Google</title><style>body{font:16px/1.6 "Lucida Grande","Lucida Sans Unicode",Tahoma,sans-serif;max-width:900px;margin:30px auto;padding:0 20px}form{padding:24px;background:#f4f8fc;border:1px solid #a5b6cb;margin-bottom:24px}label{display:block;margin:12px 0}fieldset label{display:inline-block;margin-right:15px}input,select,textarea,button{font:inherit;padding:6px}table{border-collapse:collapse}th,td{border:1px solid #333;padding:10px}th{background:#e3edfa}</style></head><body><h1>Tìm kiếm Google</h1><form method="get" action="https://www.google.com.vn/search"><label for="q">Từ khóa</label><input id="q" type="search" name="q" required><button type="submit">Tìm kiếm</button></form><h2>Tìm kiếm Bing</h2><form method="get" action="https://www.bing.com/search"><label>Từ khóa <input type="search" name="q" required></label><button type="submit">Tìm kiếm Bing</button></form><p>GET đặt tham số trên URL. POST gửi dữ liệu trong request body; chỉ HTTPS bảo vệ dữ liệu khi truyền.</p></body></html>
