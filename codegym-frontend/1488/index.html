<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng ký người dùng</title><style>body{font:16px/1.6 "Lucida Grande","Lucida Sans Unicode",Tahoma,sans-serif;max-width:900px;margin:30px auto;padding:0 20px}form{padding:24px;background:#f4f8fc;border:1px solid #a5b6cb;margin-bottom:24px}label{display:block;margin:12px 0}fieldset label{display:inline-block;margin-right:15px}input,select,textarea,button{font:inherit;padding:6px}table{border-collapse:collapse}th,td{border:1px solid #333;padding:10px}th{background:#e3edfa}</style></head><body><h1>Đăng ký người dùng</h1><form action="http://demo.codegym.vn/6/registration_form/register.php" method="post"><label>Họ và tên <input name="name" required></label><label>Email <input name="email" type="email" required></label><label>Số điện thoại <input name="phone" type="tel" required></label><fieldset><legend>Giới tính</legend><label><input type="radio" name="gender" value="male" required>Nam</label><label><input type="radio" name="gender" value="female">Nữ</label></fieldset><button type="submit">Đăng ký</button></form><p>Endpoint mẫu theo đề bài; máy chủ có thể đã ngừng hoạt động.</p></body></html>
